name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang-18 llvm-18 ffmpeg

      - name: Install Oat++
        run: |
          git clone --depth 1 https://github.com/oatpp/oatpp.git
          cd oatpp
          mkdir build && cd build
          cmake ..
          make -j$(nproc)
          sudo make install
          cd ../..
          git clone --depth 1 https://github.com/oatpp/oatpp-json.git
          cd oatpp-json
          mkdir build && cd build
          cmake ..
          make -j$(nproc)
          sudo make install

      - name: Configure and Build
        run: |
          chmod +x configure.sh scripts/release.sh
          ./scripts/release.sh

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: bonsai-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
