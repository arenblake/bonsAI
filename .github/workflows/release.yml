name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang-18 llvm-18 ffmpeg curl

      - name: Install Oat++
        run: |
          curl -L https://github.com/oatpp/oatpp/archive/refs/heads/master.tar.gz -o oatpp.tar.gz
          tar -xzf oatpp.tar.gz
          cd oatpp-master
          mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release ..
          make -j$(nproc)
          sudo make install

      - name: Configure and Build
        run: |
          chmod +x configure.sh scripts/release.sh
          ./scripts/release.sh

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: bonsai-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
