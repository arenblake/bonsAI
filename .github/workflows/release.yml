name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang-18 llvm-18 ffmpeg curl

      - name: Install Oat++
        run: |
          curl -L https://github.com/oatpp/oatpp/archive/refs/tags/1.4.0.tar.gz -o oatpp.tar.gz
          tar -xzf oatpp.tar.gz
          cd oatpp-1.4.0
          mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release ..
          make -j$(nproc)
          sudo make install

      - name: Configure and Build
        run: |
          chmod +x configure.sh scripts/release.sh
          ./scripts/release.sh

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: bonsai-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup NDK
        uses: nndixon/setup-ndk@v1
        with:
          ndk-version: r27d

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake curl

      - name: Cross-compile Oat++ for Android
        run: |
          curl -L https://github.com/oatpp/oatpp/archive/refs/tags/1.4.0.tar.gz -o oatpp.tar.gz
          tar -xzf oatpp.tar.gz
          cd oatpp-1.4.0
          mkdir build-android && cd build-android
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DOATPP_BUILD_TESTS=OFF \
            -DCMAKE_INSTALL_PREFIX=/usr/local/oatpp-android
          make -j$(nproc)
          sudo make install

      - name: Configure and Build Android Artifacts
        run: |
          chmod +x configure.sh scripts/build_android.sh
          ./configure.sh
          ./scripts/build_android.sh

      - name: Package Artifacts
        run: |
          VERSION=$(grep "project(BonsAI VERSION" CMakeLists.txt | cut -d ' ' -f 3 | tr -d ')')
          cp LiteRT-LM/bazel-bin/bonsai/bonsai ./bonsai-${VERSION}-android_arm64
          cp LiteRT-LM/bazel-bin/bonsai/libbonsai_jni.so ./libbonsai_jni-${VERSION}-android_arm64.so

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            bonsai-*-android_arm64
            libbonsai_jni-*-android_arm64.so
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
